<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E091C"/>
      <stop offset="100%" stop-color="#1A1133"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#A18CD1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">CHRONOFORGE 4D MATHEMATICAL PROJECTION &amp; HYPERPLANE SLICING</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">4D Coordinates (x,y,z,w) → 6 Orthogonal Rotations → Perspective Frustum → 3D Cross-Section Slicing</text>

  <!-- Step 1: 4D Polytope Coordinates -->
  <g transform="translate(50, 100)">
    <rect width="220" height="240" rx="10" fill="#180F2E" stroke="#A18CD1" stroke-width="1.5"/>
    <text x="110" y="30" fill="#A18CD1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. 4D HYPER-COORDINATES</text>
    <text x="110" y="65" fill="#E2E8F0" font-family="monospace" font-size="13" text-anchor="middle">P = [x, y, z, w]^T</text>
    <rect x="20" y="90" width="180" height="130" rx="6" fill="#231642"/>
    <text x="35" y="115" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="12">• Tesseract (16 vtx)</text>
    <text x="35" y="140" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="12">• 16-Cell Dual</text>
    <text x="35" y="165" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="12">• 24-Cell Self-Dual</text>
    <text x="35" y="190" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="12">• 600-Cell / Klein</text>
  </g>

  <path d="M 280 220 L 325 220" stroke="#A18CD1" stroke-width="2.5"/>
  <polygon points="330,220 320,215 320,225" fill="#A18CD1"/>

  <!-- Step 2: 6-Plane Rotations -->
  <g transform="translate(335, 100)">
    <rect width="230" height="240" rx="10" fill="#180F2E" stroke="#FBC2EB" stroke-width="1.5"/>
    <text x="115" y="30" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. 6-PLANE 4D ROTATION</text>
    <rect x="20" y="55" width="190" height="165" rx="6" fill="#231642"/>
    <text x="115" y="80" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">R_xy(θ), R_xz(θ), R_xw(θ)</text>
    <text x="115" y="105" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">R_yz(θ), R_yw(θ), R_zw(θ)</text>
    <text x="115" y="140" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Simultaneous 4D</text>
    <text x="115" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Double-Rotation Matrix</text>
    <text x="115" y="195" fill="#A18CD1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Touch &amp; Gyroscope Driven</text>
  </g>

  <path d="M 575 220 L 620 220" stroke="#FBC2EB" stroke-width="2.5"/>
  <polygon points="625,220 615,215 615,225" fill="#FBC2EB"/>

  <!-- Step 3: Perspective Frustum -->
  <g transform="translate(630, 100)">
    <rect width="210" height="240" rx="10" fill="#180F2E" stroke="#A18CD1" stroke-width="1.5"/>
    <text x="105" y="30" fill="#A18CD1" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. 4D→3D PROJECTION</text>
    <rect x="15" y="55" width="180" height="165" rx="6" fill="#231642"/>
    <text x="105" y="90" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">x' = x / (d4 - w)</text>
    <text x="105" y="115" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">y' = y / (d4 - w)</text>
    <text x="105" y="140" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">z' = z / (d4 - w)</text>
    <text x="105" y="175" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">W-Coordinate mapped to</text>
    <text x="105" y="195" fill="#FBC2EB" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Chromatic Spectrum</text>
  </g>

  <path d="M 850 220 L 890 220" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="895,220 885,215 885,225" fill="#10B981"/>

  <!-- Step 4: Slicing Hyperplane -->
  <g transform="translate(900, 100)">
    <rect width="160" height="240" rx="10" fill="#180F2E" stroke="#10B981" stroke-width="2"/>
    <text x="80" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. HYPERPLANE</text>
    <rect x="15" y="55" width="130" height="165" rx="6" fill="#231642"/>
    <text x="80" y="90" fill="#10B981" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">w = k Slice</text>
    <text x="80" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Transforms into</text>
    <text x="80" y="150" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Octahedron &amp;</text>
    <text x="80" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cuboctahedron</text>
  </g>

  <!-- Math Note -->
  <g transform="translate(50, 365)">
    <rect width="1010" height="85" rx="8" fill="#120B24" stroke="#231642"/>
    <text x="30" y="30" fill="#A18CD1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📐 HIGHER-DIMENSIONAL SPATIAL ROTATION THEORY:</text>
    <text x="30" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Unlike 3D rotations which preserve an axis of rotation, 4D rotations preserve an entire invariant plane of rotation.</text>
    <text x="30" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Hyperplane slicing reveals the 3D cross-sections of 4-polytopes as they translate through our 3-dimensional space.</text>
  </g>
</svg>